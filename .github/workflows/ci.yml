name: CI

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Lint — frontend(next lint) + ai-server(ruff)
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (next lint)
        working-directory: frontend
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Lint ai-server (ruff)
        working-directory: ai-server
        run: ruff check --select=E,F .

  # ──────────────────────────────────────────────────────────────
  # Job 2: Test — TypeScript 타입 체크 + Python 문법 검사
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax check
        working-directory: ai-server
        run: |
          python -m py_compile main.py
          find app -name "*.py" -exec python -m py_compile {} \;

  # ──────────────────────────────────────────────────────────────
  # Job 3: Docker Build — deps 스테이지까지 빌드 (LFS/환경변수 불필요)
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (deps stage)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: deps
          push: false
          cache-from: type=gha,scope=frontend-deps
          cache-to: type=gha,mode=max,scope=frontend-deps

      - name: Build ai-server image (deps stage)
        uses: docker/build-push-action@v5
        with:
          context: ./ai-server
          target: deps
          push: false
          cache-from: type=gha,scope=ai-server-deps
          cache-to: type=gha,mode=max,scope=ai-server-deps
